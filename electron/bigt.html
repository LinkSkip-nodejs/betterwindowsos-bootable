<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dihcord</title>
    <style>
      /* Reset and basic styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #7289da, #99aab5);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        padding: 20px;
      }

      h1 {
        font-size: 3rem;
        margin-bottom: 0.5rem;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
      }

      p {
        font-size: 1.2rem;
        margin-bottom: 2rem;
      }

      nav {
        margin-top: 20px;
      }

      nav a {
        text-decoration: none;
        color: #fff;
        background: rgba(0,0,0,0.2);
        padding: 10px 20px;
        margin: 0 10px;
        border-radius: 8px;
        transition: background 0.3s;
      }

      nav a:hover {
        background: rgba(0,0,0,0.4);
      }

      footer {
        position: absolute;
        bottom: 10px;
        font-size: 0.9rem;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <h1>Dihcord</h1>
    <p>The routing is working. 🎉</p>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
    <footer>&copy; 2026 Dihcord Placeholder</footer>
  </body>
</html>
